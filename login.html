<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tajweed Quiz - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
            color: #343A40;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-end; /* Align content to the right */
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPDEyvBPVbPJA9smPGR7CiSpghgyUAAw65MA&s'); /* New scenic travel image from provided URL */
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden; /* Prevent scrolling if content overflows slightly */
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45); /* Slightly darker overlay for better text readability on the new image */
            z-index: 1;
        }
        .login-container {
            position: relative;
            z-index: 2;
            background-color: rgba(255, 255, 255, 0.99); /* Increased opacity for better contrast */
            border-radius: 1.25rem; /* More rounded corners for a softer look */
            padding: 3rem; /* Increased padding */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35); /* More pronounced shadow */
            max-width: 480px; /* Slightly wider login card */
            width: 90%; /* Responsive width */
            text-align: center;
            margin-right: 7%; /* Pushes the container more to the right */
            margin-left: 3%; /* Ensures it's centered on smaller screens while maintaining right bias on larger ones */
            border: 1px solid rgba(0, 0, 0, 0.05); /* Added subtle border for definition */

            /* Responsive adjustments for smaller screens */
            @media (max-width: 768px) {
                margin-right: auto; /* Center on small screens */
                margin-left: auto;
                padding: 2rem; /* Slightly less padding on small screens */
            }
        }
        .login-container .logo {
            font-size: 2.2rem; /* Smaller font size as requested */
            font-weight: 700;
            color: #007BFF;
            margin-bottom: 1.8rem; /* Adjusted space below logo */
            display: block;
        }
        .login-container h2 {
            font-weight: 600;
            color: #343A40;
            margin-bottom: 1.8rem; /* Adjusted space below heading */
        }
        .form-control {
            border-radius: 0.75rem; /* More rounded input fields */
            padding: 0.85rem 1.25rem; /* Larger padding for inputs */
            border: 1px solid #e0e0e0; /* Lighter border */
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-control:focus {
            border-color: #007BFF;
            box-shadow: 0 0 0 0.3rem rgba(0, 123, 255, 0.2); /* Softer focus shadow */
        }
        .btn-primary {
            background-color: #007BFF;
            border-color: #007BFF;
            border-radius: 0.75rem;
            padding: 0.85rem 1.75rem; /* Larger button padding */
            font-weight: 600;
            font-size: 1.1rem; /* Slightly larger font for button */
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            transform: translateY(-1px); /* Slight lift on hover */
        }
        .text-muted a {
            color: #007BFF;
            text-decoration: none;
            font-weight: 500;
        }
        .text-muted a:hover {
            text-decoration: underline;
        }
        .social-login-buttons .btn {
            border-radius: 0.75rem; /* More rounded social buttons */
            padding: 0.85rem 1.25rem; /* Larger padding for social buttons */
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem; /* Increased gap */
            width: 100%;
            font-size: 1rem;
        }
        .social-login-buttons .btn-google {
            background-color: #DB4437; /* Google Red */
            color: white;
            border-color: #DB4437;
        }
        .social-login-buttons .btn-google:hover {
            background-color: #c23321;
            border-color: #c23321;
        }
        .social-login-buttons .btn-facebook {
            background-color: #4267B2; /* Facebook Blue */
            color: white;
            border-color: #4267B2;
        }
        .social-login-buttons .btn-facebook:hover {
            background-color: #365899;
            border-color: #365899;
        }
        .social-login-buttons img {
            height: 1.3rem; /* Slightly larger icon size */
            width: 1.3rem;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0; /* More vertical space for divider */
            color: #6C757D;
            font-size: 0.95rem;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .divider:not(:empty)::before {
            margin-right: .75em; /* More space around OR */
        }
        .divider:not(:empty)::after {
            margin-left: .75em;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 class="mb-4">Sign In</h2>
        <form>
            <div class="mb-3">
                <input type="email" class="form-control" id="emailInput" placeholder="Email or Username" required>
            </div>
            <div class="mb-4">
                <input type="password" class="form-control" id="passwordInput" placeholder="Password" required>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg">Login</button>
            </div>
            <div class="text-center mb-4">
                <a href="#">Forgot Password?</a>
            </div>
        </form>

        <p class="mt-4 text-muted">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>

    <!-- Bootstrap JS (bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
